<html lang="es">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1614" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="https://api.iconify.design/hugeicons/organic-food.svg?color=%23335c48" />

      (function () {
        try {
          var stored = localStorage.getItem('sibo-theme');
          if (stored === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
